name: Bug report
description: Something in Rundesk is not working as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The steps that make it happen, as far as you know them.
      placeholder: |
        1. Open …
        2. Click …
  - type: input
    id: version
    attributes:
      label: Rundesk version
      description: Filled in when you report from Settings → About.
      placeholder: v0.4.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.4"
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, which agent or command was involved, how often it happens.
