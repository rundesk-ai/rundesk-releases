name: Bug report
description: Something in Rundesk is not working as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Issues are public, so leave out anything private, such as keys, paths with your name in them or client code.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What went wrong, with any error message copied exactly. Screenshots help.
      placeholder: 'When I stop a dev server from the sidebar, it shows as stopped, but starting it again fails with "Error: listen EADDRINUSE :::3000".'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What should have happened.
      placeholder: The command stops, and starting it again works.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Rundesk version
      description: Filled in when you report from Rundesk.
      placeholder: v0.50.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS or Windows version
      description: Filled in when you report from Rundesk.
      placeholder: "macOS 15.4, or Windows 11"
