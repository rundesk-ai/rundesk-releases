name: Feature request
description: Something Rundesk could do, or do better.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: What Rundesk should do, and the problem it would solve for you.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Any workaround you use now.
  - type: input
    id: version
    attributes:
      label: Rundesk version
      description: Filled in when you ask from Settings → About.
      placeholder: v0.4.0
