name: Feature request
description: Something Rundesk could do, or do better.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Each box has an example; replace it with your own.
  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: What gets in your way today, and how you work around it now.
      placeholder: I run agents in five projects, and switching between them means scrolling the sidebar and clicking every time.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Rundesk to do?
      description: The change that would help, in your own words.
      placeholder: A key that jumps straight to a project, or to one of its agents or files.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Rundesk version
      description: Filled in when you ask from Settings → About.
      placeholder: v0.47.1
